name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        # Exit code 5 means "no tests collected" -- tolerated as a temporary
        # state while tests/ is empty; remove this tolerance once real tests
        # exist (see PLAN.md testing strategy).
        run: uv run pytest || [ "$?" = "5" ]
